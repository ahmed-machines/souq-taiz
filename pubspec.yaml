name: souq_taiz
description: "Souq Taiz | سوق تعز - local marketplace platform for Taiz, Yemen."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  url_launcher: ^6.3.2

flutter:
  uses-material-design: true
  generate: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.5.0
